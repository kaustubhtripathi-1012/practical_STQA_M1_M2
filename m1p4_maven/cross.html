<!DOCTYPE html>
<html>

<head>
    <title>Cross Browser Testing</title>
</head>

<body>

<h2>Cross Browser Testing Using Selenium Grid</h2>

<p id="message">Selenium Grid Test</p>

<button id="testButton" onclick="testBrowser()">
    Click Me
</button>

<script>

function testBrowser() {
    document.getElementById("message").innerHTML =
        "Button clicked successfully";
}

</script>

</body>

</html>
